<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <style>
        /* Reset CSS cơ bản */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p.description {
            color: #666;
            margin-bottom: 30px;
        }

        /* Thư viện ảnh (Gallery Container) sử dụng CSS Grid */
        .gallery {
            display: grid;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            /* Mặc định (> 700px): 4 ảnh trên 1 dòng */
            grid-template-columns: repeat(4, 1fr);
        }

        .gallery-item {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .gallery-item .caption {
            padding: 12px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }

        /* ---------------------------------------------------- */
        /* MEDIA QUERIES RESPONSIVE MANAGEMENT                  */
        /* ---------------------------------------------------- */

        /* 1. Màn hình nhỏ hơn hoặc bằng 768px/700px: 2 ảnh trên 1 dòng */
        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 2. Màn hình nhỏ hơn hoặc bằng 500px: 1 ảnh trên 1 dòng */
        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>
<body>

    <h1>Bộ Sưu Tập Ảnh Responsive</h1>
    <p class="description">Thay đổi kích thước trình duyệt để kiểm tra số lượng cột ảnh tương ứng.</p>

    <!-- Khung chứa danh sách ảnh Gallery -->
    <div class="gallery">
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=1" alt="Hình ảnh 1">
            <div class="caption">Hình ảnh 1</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=2" alt="Hình ảnh 2">
            <div class="caption">Hình ảnh 2</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=3" alt="Hình ảnh 3">
            <div class="caption">Hình ảnh 3</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=4" alt="Hình ảnh 4">
            <div class="caption">Hình ảnh 4</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=5" alt="Hình ảnh 5">
            <div class="caption">Hình ảnh 5</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=6" alt="Hình ảnh 6">
            <div class="caption">Hình ảnh 6</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=7" alt="Hình ảnh 7">
            <div class="caption">Hình ảnh 7</div>
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/400/300?random=8" alt="Hình ảnh 8">
            <div class="caption">Hình ảnh 8</div>
        </div>
    </div>

</body>
</html>
